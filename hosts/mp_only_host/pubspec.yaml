name: mp_only_host
description: Mp-only reference host for the lightweight mini-program runtime.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  mini_program_contracts:
    path: ../../packages/mini_program_contracts
  mini_program_sdk:
    path: ../../packages/mini_program_sdk

dev_dependencies:
  integration_test:
    sdk: flutter
  mini_program_ui:
    path: ../../packages/mini_program_ui
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/mini_programs/mp_profile_center/manifest.json
    - assets/mini_programs/mp_profile_center/screens/mp_profile_center_home.json
    - assets/mini_programs/mp_profile_center/screens/mp_profile_center_details.json
    - assets/mini_programs/mp_ai_food_demo/manifest.json
    - assets/mini_programs/mp_ai_food_demo/screens/home.json
    - assets/mini_programs/mp_ai_food_demo/screens/menu.json
    - assets/mini_programs/mp_ai_food_demo/screens/cart.json
    - assets/mini_programs/mp_ai_controls_demo/manifest.json
    - assets/mini_programs/mp_ai_controls_demo/screens/home.json
    - assets/mini_programs/mp_ai_controls_demo/screens/catalog.json
